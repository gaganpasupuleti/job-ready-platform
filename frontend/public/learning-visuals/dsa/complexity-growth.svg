<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <title>Linear steps compared with quadratic pair counts</title>
  <rect width="720" height="440" fill="#fffcf8"/>
  <text x="32" y="42" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Linear pass vs pair counting</text>
  <rect x="32" y="64" width="18" height="18" fill="#9eb0be"/>
  <text x="58" y="78" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">Single pass: n steps</text>
  <rect x="250" y="64" width="18" height="18" fill="#3f5564"/>
  <text x="276" y="78" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">Pairs: n(n-1)/2 steps</text>
  <line x1="70" y1="340" x2="660" y2="340" stroke="#d3cdc3" stroke-width="2"/>
  <rect x="110" y="328" width="42" height="12" fill="#9eb0be"/>
  <rect x="162" y="334" width="42" height="6" fill="#3f5564"/>
  <rect x="310" y="316" width="42" height="24" fill="#9eb0be"/>
  <rect x="362" y="304" width="42" height="36" fill="#3f5564"/>
  <rect x="510" y="292" width="42" height="48" fill="#9eb0be"/>
  <rect x="562" y="172" width="42" height="168" fill="#3f5564"/>
  <text x="118" y="318" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="14">2</text>
  <text x="174" y="324" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="14">1</text>
  <text x="318" y="306" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="14">4</text>
  <text x="370" y="294" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="14">6</text>
  <text x="518" y="282" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="14">8</text>
  <text x="568" y="162" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="14">28</text>
  <text x="124" y="368" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="18">n = 2</text>
  <text x="324" y="368" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="18">n = 4</text>
  <text x="524" y="368" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="18">n = 8</text>
  <text x="32" y="408" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="18">At n = 8 a single pass is 8 steps. Pair counting is 28 steps, which is O(n^2).</text>
</svg>
