<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Number pattern using times 2 plus 1</title>
  <rect width="760" height="360" fill="#fffcf8"/>
  <text x="32" y="46" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">One rule for every step</text>
  <rect x="28" y="84" width="100" height="72" rx="8" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <rect x="176" y="84" width="100" height="72" rx="8" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <rect x="324" y="84" width="100" height="72" rx="8" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <rect x="472" y="84" width="100" height="72" rx="8" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <rect x="620" y="84" width="108" height="72" rx="8" fill="#3f5564"/>
  <text x="62" y="130" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="32">2</text>
  <text x="210" y="130" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="32">5</text>
  <text x="350" y="130" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="32">11</text>
  <text x="498" y="130" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="32">23</text>
  <text x="648" y="130" fill="#fffcf8" font-family="Segoe UI, Arial, sans-serif" font-size="32">47</text>
  <text x="132" y="128" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="22">-&gt;</text>
  <text x="280" y="128" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="22">-&gt;</text>
  <text x="428" y="128" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="22">-&gt;</text>
  <text x="576" y="128" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="22">-&gt;</text>
  <text x="128" y="196" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">x2+1</text>
  <text x="276" y="196" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">x2+1</text>
  <text x="424" y="196" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">x2+1</text>
  <text x="572" y="196" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">x2+1</text>
  <text x="32" y="260" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="20">Check: 2x2+1=5, 5x2+1=11, 11x2+1=23, 23x2+1=47.</text>
  <text x="32" y="300" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="18">Differences 3, 6, 12, 24 also double at every step.</text>
</svg>
