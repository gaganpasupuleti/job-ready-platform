<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <title>Status counts and the share of 200 responses</title>
  <rect width="720" height="420" fill="#fffcf8"/>
  <text x="36" y="44" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Counts, then the share</text>
  <line x1="72" y1="300" x2="430" y2="300" stroke="#d3cdc3" stroke-width="2"/>
  <rect x="92" y="180" width="48" height="120" fill="#3f5564"/>
  <rect x="160" y="240" width="48" height="60" fill="#9eb0be"/>
  <rect x="228" y="240" width="48" height="60" fill="#9eb0be"/>
  <rect x="296" y="240" width="48" height="60" fill="#9eb0be"/>
  <rect x="364" y="240" width="48" height="60" fill="#9eb0be"/>
  <text x="104" y="168" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">2</text>
  <text x="176" y="228" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">1</text>
  <text x="244" y="228" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">1</text>
  <text x="312" y="228" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">1</text>
  <text x="380" y="228" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="16">1</text>
  <text x="96" y="324" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">200</text>
  <text x="168" y="324" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">201</text>
  <text x="236" y="324" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">400</text>
  <text x="304" y="324" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">404</text>
  <text x="372" y="324" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">500</text>
  <text x="72" y="358" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">Bar height is the count, not a percent.</text>
  <rect x="470" y="120" width="214" height="180" rx="6" fill="#f3f0ea" stroke="#d3cdc3"/>
  <text x="486" y="156" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="18">Total = 6</text>
  <text x="486" y="190" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="18">200 count = 2</text>
  <text x="486" y="224" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="18">Share = 2/6</text>
  <text x="486" y="258" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="18">= 1/3, about 33%</text>
</svg>
