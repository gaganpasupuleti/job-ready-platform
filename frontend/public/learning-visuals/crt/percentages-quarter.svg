<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <title>25 percent is one quarter of 240</title>
  <rect width="720" height="420" fill="#fffcf8"/>
  <text x="36" y="46" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">25% is one quarter</text>
  <rect x="36" y="78" width="150" height="78" rx="6" fill="#3f5564"/>
  <rect x="198" y="78" width="150" height="78" rx="6" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <rect x="360" y="78" width="150" height="78" rx="6" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <rect x="522" y="78" width="150" height="78" rx="6" fill="#f3f0ea" stroke="#3f5564" stroke-width="2"/>
  <text x="78" y="124" fill="#fffcf8" font-family="Segoe UI, Arial, sans-serif" font-size="24">25%</text>
  <text x="36" y="186" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="18">Shaded part: 1 of 4 equal parts</text>
  <rect x="36" y="230" width="180" height="92" rx="6" fill="#f3f0ea" stroke="#d3cdc3"/>
  <rect x="268" y="230" width="180" height="92" rx="6" fill="#f3f0ea" stroke="#d3cdc3"/>
  <rect x="500" y="230" width="180" height="92" rx="6" fill="#e7edf1" stroke="#3f5564" stroke-width="2"/>
  <text x="92" y="268" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="28">240</text>
  <text x="78" y="298" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">listed price</text>
  <text x="318" y="268" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="28">- 60</text>
  <text x="292" y="298" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">discount, once</text>
  <text x="552" y="268" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="28">180</text>
  <text x="540" y="298" fill="#5e5952" font-family="Segoe UI, Arial, sans-serif" font-size="16">sale price</text>
  <text x="224" y="284" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="28">-&gt;</text>
  <text x="456" y="284" fill="#3f5564" font-family="Segoe UI, Arial, sans-serif" font-size="28">-&gt;</text>
  <text x="36" y="378" fill="#2a2825" font-family="Segoe UI, Arial, sans-serif" font-size="20">240 x 0.25 = 60. Then 240 - 60 = 180.</text>
</svg>
