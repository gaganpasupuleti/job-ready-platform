services:
  postgres:
    image: postgres:16-alpine
    container_name: jrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobready_dev}
      POSTGRES_DB: ${POSTGRES_DB:-jobready_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobready} -d ${POSTGRES_DB:-jobready_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_sql_sandbox:
    image: postgres:16-alpine
    container_name: jrp-postgres-sql-sandbox
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobready_sql_admin
      POSTGRES_PASSWORD: jobready_sql_admin_dev
      POSTGRES_DB: jobready_sql_sandbox
    ports:
      - "5433:5432"
    volumes:
      - postgres_sql_sandbox_data:/var/lib/postgresql/data
      - ./docker/init-sql-sandbox.sh:/docker-entrypoint-initdb.d/01-init-runner.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobready_sql_admin -d jobready_sql_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jrp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: jrp-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobready}:${POSTGRES_PASSWORD:-jobready_dev}@postgres:5432/${POSTGRES_DB:-jobready_db}
      REDIS_URL: redis://redis:6379/0
      SQL_SANDBOX_ADMIN_DATABASE_URL: postgresql+asyncpg://jobready_sql_admin:jobready_sql_admin_dev@postgres_sql_sandbox:5432/jobready_sql_sandbox
      SQL_SANDBOX_RUNNER_DATABASE_URL: postgresql+asyncpg://jobready_sql_runner:jobready_sql_dev@postgres_sql_sandbox:5432/jobready_sql_sandbox
      SQL_SANDBOX_DATABASE_URL: postgresql+asyncpg://jobready_sql_runner:jobready_sql_dev@postgres_sql_sandbox:5432/jobready_sql_sandbox
      SQL_EXECUTION_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_sql_sandbox:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: jrp-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  postgres_sql_sandbox_data:
  redis_data:
