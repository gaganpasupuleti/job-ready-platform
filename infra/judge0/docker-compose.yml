# Judge0 CE — isolated code execution (NOT Job Ready Postgres/Redis)
#
# Pinned image: judge0/judge0:1.13.1
# Tested: 2026-08-29 (Build 4.2)
# Requires: Linux host with privileged Docker (isolate/cgroup). Do NOT run on Railway workers.
#
# Usage:
#   cp .env.example .env   # fill secrets
#   docker compose up -d
#   curl -H "X-Auth-Token: $JUDGE0_AUTH_TOKEN" http://localhost:2358/about

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "${JUDGE0_PUBLISH_PORT:-2358}:2358"
    privileged: true
    depends_on:
      - db
      - redis
    restart: unless-stopped

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Start order (official): docker compose up -d db redis && sleep 10 && docker compose up -d

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}
    volumes:
      - judge0_redis_data:/data
    restart: unless-stopped

volumes:
  judge0_postgres_data:
  judge0_redis_data:
